<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link rel="icon" type="image/x-icon" href="/favicon.ico" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<link rel="manifest" href="/manifest.webmanifest" />

		<!-- viewport-fit=cover enables env(safe-area-inset-*) on notched devices -->
		<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
		<meta name="format-detection" content="telephone=no" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="apple-mobile-web-app-title" content="Filedrop" />

		<!-- Browser chrome tint = header band colour. The script below applies the
		     saved theme before first paint so dark-mode users don't get a light flash;
		     theme-provider.tsx keeps both in sync afterwards. -->
		<meta name="theme-color" content="#e7e6e4" />
		<script>
			(function () {
				try {
					var saved = localStorage.getItem('vite-ui-theme') || 'system';
					var dark = saved === 'dark' || (saved !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
					var root = document.documentElement;
					root.classList.add(dark ? 'dark' : 'light');
					root.style.colorScheme = dark ? 'dark' : 'light';
					if (dark) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#212327');
				} catch (e) {}
			})();
		</script>

		<!-- SEO Meta Tags -->
		<title>Filedrop - Secure Encrypted File Transfer & Sharing</title>
		<meta name="description" content="Transfer files securely with end-to-end AES-256 encryption. No account required. Share files with auto-expiry, download limits, and burn-after-read. Free, private, and secure file sharing.">
		<meta name="keywords" content="file transfer, secure file sharing, encrypted file transfer, send files securely, private file sharing, end-to-end encryption, temporary file sharing, self-destructing files, secure upload, file drop">
		<meta name="author" content="Filedrop">
		<meta name="robots" content="index, follow">
		<link rel="canonical" href="https://filedrop.xyz">

		<!-- Structured Data -->
		<script type="application/ld+json">
		{
			"@context": "https://schema.org",
			"@type": "WebApplication",
			"name": "Filedrop",
			"url": "https://filedrop.xyz",
			"description": "Secure encrypted file transfer and sharing service with end-to-end AES-256 encryption, auto-expiry, and download limits.",
			"applicationCategory": "UtilitiesApplication",
			"operatingSystem": "Any",
			"offers": {
				"@type": "Offer",
				"price": "0",
				"priceCurrency": "USD"
			},
			"featureList": [
				"End-to-end AES-256 encryption",
				"No account required",
				"Auto-expiring files",
				"Download limits",
				"Burn after read option",
				"Up to 500MB file size"
			]
		}
		</script>
	</head>
	<body>
		<div id="app"></div>
		<script type="module" src="/src/index.tsx"></script>
		
		<!-- Unregister any existing service workers -->
		<script>
			if ('serviceWorker' in navigator) {
				navigator.serviceWorker.getRegistrations().then(function(registrations) {
					for(let registration of registrations) {
						registration.unregister();
					}
				});
			}
		</script>
	</body>
</html>
